# Pre-release sanity — product IDs + PennyCoreLogic tests (Linux).
# View results under Actions → Pre-release Sanity.
# Full iOS / SwiftData tests still need a Mac: ./scripts/pre-release-sanity.sh --xcode
name: Pre-release Sanity

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pre-release-sanity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanity:
    name: Product IDs + core logic
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Swift version
        id: swift-version
        run: |
          # Keep CI on the Package.swift tools version floor (5.10+).
          echo "version=6.0.3" >> "$GITHUB_OUTPUT"

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ steps.swift-version.outputs.version }}

      - name: Show Swift
        run: swift --version

      - name: Run pre-release sanity
        run: ./scripts/pre-release-sanity.sh

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-sanity-log
          path: |
            Tools/PennyCoreLogic/.build/logs/**
            /tmp/pre-release-*.log
          if-no-files-found: ignore
          retention-days: 14
