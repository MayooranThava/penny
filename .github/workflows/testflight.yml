# Archive Penny and upload to TestFlight on every push to main.
# Requires GitHub secrets (same App Store Connect API key as Void Runner):
#   ASC_ISSUER_ID, ASC_KEY_ID, ASC_PRIVATE_KEY
#
# Optional secrets / vars:
#   TESTFLIGHT_EXTERNAL_GROUP_ID — ASC beta group UUID for external testers
name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testflight-main
  cancel-in-progress: false

jobs:
  upload:
    name: Archive & upload
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${ASC_PRIVATE_KEY:-}" || -z "${ASC_KEY_ID:-}" ]]; then
            echo "Missing ASC_PRIVATE_KEY or ASC_KEY_ID secrets." >&2
            echo "Add them under Repo → Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          chmod 600 "$KEY_PATH"

      - name: Resolve next build number
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet PyJWT cryptography
          BUILD="$(python3 scripts/next_build_number.py --fallback "${{ github.run_number }}")"
          echo "PENNY_BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "Using CURRENT_PROJECT_VERSION=$BUILD"

      - name: Archive, export, upload to App Store Connect
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_PATH: ${{ env.ASC_KEY_PATH }}
          PENNY_BUILD_NUMBER: ${{ env.PENNY_BUILD_NUMBER }}
        run: ./scripts/ci_testflight.sh

      - name: Assign build to TestFlight groups (best effort)
        if: success()
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          PENNY_BUILD_NUMBER: ${{ env.PENNY_BUILD_NUMBER }}
          TESTFLIGHT_EXTERNAL_GROUP_ID: ${{ secrets.TESTFLIGHT_EXTERNAL_GROUP_ID }}
        run: |
          set -euo pipefail
          python3 scripts/asc_setup_penny.py assign-build \
            --build-number "$PENNY_BUILD_NUMBER" \
            --internal-group-id e2003e1f-f82e-4bd0-85f9-a5dfc4f4cec5 \
            ${TESTFLIGHT_EXTERNAL_GROUP_ID:+--external-group-id "$TESTFLIGHT_EXTERNAL_GROUP_ID"} \
            || echo "Group assign skipped/failed — build may still appear after ASC processing."
